name: download_boot_img
on:
  workflow_call:
    inputs:
      device:
        description: 'device code name , e.g.,"lynx"'
        required: true
        type: 'string'
      tag:
        description: 'build tag'
        required: true
        type: 'string'
jobs:
  download_boot_img:
    runs-on: ubuntu-latest
    concurrency:
      group: download_boot_img_reuse
      cancel-in-progress: false
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }} 
      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: echo_input
        run: |
          echo "${{needs.parse_issue.outputs.device}}"
          echo "${{needs.parse_issue.outputs.tag}}"
      - run: ./scripts/run_in_wd.sh ${{ github.event.inputs.device }} ${{ github.event.inputs.tag }}
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "dummy@.github.com"
          ./scripts/commit_push.sh