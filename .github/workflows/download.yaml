name: download_boot_img
on:
  workflow_dispatch:
    inputs:
      device:
        description: 'device code name , e.g.,"lynx"'
        required: true
        type: 'string'
      tag:
        description: 'build tag'
        required: true
        type: 'string'
jobs:
  download_boot_img:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }} 
      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: echo "before download"
      - run: ./scripts/run_in_wd.sh ${{ github.event.inputs.device }} ${{ github.event.inputs.tag }}
      - run: echo "after download"
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "dummy@.github.com"
          git add -A
          git commit -m "Automated changes from workflow"
          git push